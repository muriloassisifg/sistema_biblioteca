[project]
name = "backend"
version = "0.4.0"
description = "Biblioteca do Campus - API do encontro 6: migracoes e login"
requires-python = ">=3.11"

dependencies = [
    "fastapi (>=0.115)",
    "uvicorn (>=0.30)",
    "pydantic[email] (>=2.7)",
    "sqlalchemy (>=2.0)",
    "python-dotenv (>=1.0)",
    "psycopg[binary] (>=3.1)",
    "alembic (>=1.13)",
    "pyjwt (>=2.8)",
    "bcrypt (>=4.0)",
    "python-multipart (>=0.0.9)",
]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.0,<10.0)",
    "httpx (>=0.28,<0.29)",
]
