[project]
name = "sistema-biblioteca"
version = "0.4.0"
description = "Biblioteca do Campus - o sistema das disciplinas Programacao III e Programacao para Web III"
requires-python = ">=3.11"

dependencies = [
    "fastapi (>=0.115)",
    "uvicorn (>=0.30)",
    "pydantic (>=2.7)",
    "sqlalchemy (>=2.0)",
    "python-dotenv (>=1.0)",
    "psycopg[binary] (>=3.1)",
]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
httpx = ">=0.27"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
